[project]
name = "slm"
version = "0.1.0"
description = "Examples and experiments with small language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "dspy[optuna]>=3.4.0",
]

[dependency-groups]
dev = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm"]
